<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Lanka National Chess Championship 2026 - Live Broadcast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0062ff;
            --bg-color: #f4f7f6;
            --text-main: #202124;
            --text-muted: #5f6368;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 98, 255, 0.1);
            --tab-bg: rgba(255, 255, 255, 0.7);
            --footer-bg: #202124;
            --card-shadow: rgba(0,0,0,0.05);
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --primary-blue: #3a86ff;
            --bg-color: #121212;
            --text-main: #e8eaed;
            --text-muted: #a0a0a0;
            --glass-bg: rgba(30, 30, 30, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --tab-bg: rgba(40, 40, 40, 0.8);
            --footer-bg: #0a0a0a;
            --card-shadow: rgba(0,0,0,0.3);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Roboto", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; transition: background-color 0.3s, color 0.3s; }
        
        /* Tabs */
        .top-tabs-container { position: sticky; top: 0; z-index: 1000; display: flex; width: 100%; background: #1a1a1a; border-bottom: 5px solid var(--tab-bg); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .top-tab-btn { height: 55px; flex: 1; background: var(--tab-bg); color: var(--text-main); border: none; padding: 1rem; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .top-tab-btn:first-child { border-right: 1px solid rgba(0, 0, 0, 0.1); }
        .top-tab-btn.active, .top-tab-btn:hover { background: var(--primary-blue); color: #ffffff; }
        
        /* Header - Decreased line height and padding to save space */
        header { background-color: var(--primary-blue); color: #ffffff; padding: 0.5rem 1rem; text-align: center; box-shadow: 0 4px 12px rgba(0, 98, 255, 0.2); transition: background-color 0.3s; }
        header h1 { font-weight: 900; font-size: 1.6rem; line-height: 1.2; letter-spacing: 1px; margin: 0; }
        
        /* Layout container */
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 8px 32px var(--card-shadow); transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
        
        /* Live Title & Badges - Added top margin for white space */
        .live-header { text-align: center; margin-top: 1.5rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: center; }
        .live-title { font-size: 1.5rem; font-weight: 700; color: var(--primary-blue); margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; }
        .live-badge { display: inline-flex; align-items: center; background-color: #6a112a; border-radius: 20px; padding: 4px 14px; margin-left: 12px; vertical-align: middle; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .live-dot { width: 10px; height: 10px; background-color: #ff4d4d; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        .live-text { color: #fff; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
        
        /* Countdown Timer */
        .countdown-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 1.5rem; }
        .countdown-box { background-color: var(--primary-blue); color: #ffffff; border-radius: 12px; padding: 15px 20px; min-width: 90px; text-align: center; box-shadow: 0 6px 15px rgba(0, 98, 255, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background-color 0.3s; }
        .countdown-num { font-size: 2.5rem; font-weight: 900; line-height: 1; letter-spacing: -1px; }
        .countdown-lbl { font-size: 0.85rem; font-weight: 700; margin-top: 6px; }
        
        /* Iframe Container */
        .media-container {
            position: relative;
            width: 100%;
            height: 75vh; 
            min-height: 500px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .media-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; border-radius: 16px; }

        /* Theme Toggle Button */
        .theme-toggle-container { display: flex; justify-content: center; margin-bottom: 2rem; }
        .theme-toggle-btn { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--border-color); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 0.6rem 1.2rem; border-radius: 20px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; box-shadow: 0 4px 12px var(--card-shadow); }
        .theme-toggle-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px var(--card-shadow); border-color: var(--primary-blue); }
        
        /* Footer - Added 3rem extra space below by expanding bottom padding to 6rem */
        footer { background: var(--footer-bg); color: #ffffff; text-align: center; padding: 3rem 1rem 6rem 1rem; margin-top: 3rem; display: flex; flex-direction: column; align-items: center; transition: background 0.3s; }
        
        /* Responsive */
        @media (max-width: 600px) {
            .countdown-num { font-size: 2rem; }
            .countdown-box { min-width: 75px; padding: 12px 10px; }
            .top-tab-btn { font-size: 0.85rem; padding: 0.8rem 0.5rem; white-space: normal; }
            header h1 { font-size: 1.3rem; line-height: 1.2; }
            .live-title { font-size: 1.2rem; }
        }
        @media (max-width: 768px) {
            .container { padding: 0; margin-top: 0; }
            .card { border-radius: 0; padding: 1rem 0.5rem; margin-bottom: 0.5rem; }
            .card:has(.media-container) { padding: 0; border: none; }
            .media-container { border-radius: 0; height: 85vh; min-height: 550px; }
            .theme-toggle-container { margin-top: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="top-tabs-container">
        <button class="top-tab-btn active" id="tab-open" onclick="switchTab('open')">Open Section</button>
        <button class="top-tab-btn" id="tab-women" onclick="switchTab('women')">Women Section</button>
    </div>

    <header>
        <h1>Sri Lanka National Chess Championship 2026</h1>
    </header>

    <div class="container">
        <div class="card">
            <div class="live-header">
                <div class="live-title" id="live-status-text">Loading Schedule...</div>
                
                <div class="countdown-container" id="countdown-timer" style="display: none;">
                    <div class="countdown-box">
                        <span class="countdown-num" id="cd-hours">00</span>
                        <span class="countdown-lbl">Hours</span>
                    </div>
                    <div class="countdown-box">
                        <span class="countdown-num" id="cd-mins">00</span>
                        <span class="countdown-lbl">Mins</span>
                    </div>
                    <div class="countdown-box">
                        <span class="countdown-num" id="cd-secs">00</span>
                        <span class="countdown-lbl">Secs</span>
                    </div>
                </div>
            </div>
            
            <div class="media-container">
                <iframe id="broadcast-iframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <div class="theme-toggle-container">
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> CHESS SAVIYA</p>
    </footer>

    <script>
        // Start times in Sri Lanka Time (SLST: UTC+5:30)
        const schedule = [
            { round: 1, start: new Date("2026-04-18T09:00:00+05:30") },
            { round: 2, start: new Date("2026-04-18T15:00:00+05:30") },
            { round: 3, start: new Date("2026-04-19T09:00:00+05:30") },
            { round: 4, start: new Date("2026-04-19T15:00:00+05:30") },
            { round: 5, start: new Date("2026-04-20T09:00:00+05:30") },
            { round: 6, start: new Date("2026-04-20T15:00:00+05:30") },
            { round: 7, start: new Date("2026-04-24T09:00:00+05:30") },
            { round: 8, start: new Date("2026-04-24T15:00:00+05:30") },
            { round: 9, start: new Date("2026-04-25T09:00:00+05:30") },
            { round: 10, start: new Date("2026-04-25T15:00:00+05:30") },
            { round: 11, start: new Date("2026-04-26T09:00:00+05:30") },
            { round: 12, start: new Date("2026-04-26T15:00:00+05:30") },
            { round: 13, start: new Date("2026-04-27T09:00:00+05:30") }
        ];

        // Unique IDs for Lichess broadcasts
        const links = {
            open: [
                "UHcAwsfo", "yPnCCNU5", "FeNvFHvC", "4p98VYXD", "1hiF2AL7", "scMtoCLo",
                "nbw3He2T", "nm7syZJ9", "pnVgdKCl", "VKy4j3sJ", "6BlLYlkB", "Wax4yNFl", "Navi2bd1"
            ],
            women: [
                "8R7HQyqK", "vGsASHgS", "JEgQJNKa", "NrT4BG5N", "g2ARYZKo", "x9ULMr0O",
                "eSRln8tQ", "ptKmq5xG", "wNYxzve7", "v5P0WjmM", "R4C1LejS", "jSBj3Ulh", "ImFaUi28"
            ]
        };

        let currentCategory = 'open';
        let lastRenderedUrl = "";
        let isDarkMode = false; // Default is light mode

        function switchTab(category) {
            currentCategory = category;
            document.getElementById('tab-open').classList.toggle('active', category === 'open');
            document.getElementById('tab-women').classList.toggle('active', category === 'women');
            updateLogic();
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('theme-toggle').innerText = '☀️ Light Mode';
            } else {
                document.body.removeAttribute('data-theme');
                document.getElementById('theme-toggle').innerText = '🌙 Dark Mode';
            }
            // Clear last rendered URL to force iframe reload with new bg parameter
            lastRenderedUrl = "";
            updateLogic();
        }

        function getLiveBadge() {
            return `<span class="live-badge"><span class="live-dot"></span><span class="live-text">LIVE</span></span>`;
        }

        function updateLogic() {
            // Get current time in Sri Lanka
            const slstString = new Date().toLocaleString("en-US", {timeZone: "Asia/Colombo"});
            const now = new Date(slstString);
            
            let activeRoundIndex = -1;
            let phase = ""; // "UPCOMING", "LIVE", "RANKING"
            let countdownTo = null;

            // Determine Tournament State
            for (let i = 0; i < schedule.length; i++) {
                let rStart = schedule[i].start;
                let rEnd = new Date(rStart.getTime() + (4 * 60 * 60 * 1000)); // Start time + 4 hours

                if (now < rStart) {
                    activeRoundIndex = i;
                    phase = "UPCOMING";
                    // Only show countdown if within 24 hours of start
                    if (rStart - now <= 24 * 60 * 60 * 1000) {
                        countdownTo = rStart;
                    }
                    break;
                } else if (now >= rStart && now < rEnd) {
                    activeRoundIndex = i;
                    phase = "LIVE";
                    break; // Currently live
                } else if (i === schedule.length - 1 || now < schedule[i+1].start) {
                    // After 4 hours, but before next round starts
                    activeRoundIndex = i;
                    phase = "RANKING";
                    // If not the last round, prepare countdown for the next round
                    if (i < schedule.length - 1) {
                        let nextStart = schedule[i+1].start;
                        if (nextStart - now <= 24 * 60 * 60 * 1000) {
                            countdownTo = nextStart;
                        }
                    }
                    break;
                }
            }

            // Fallbacks for before and after the entire tournament
            if (activeRoundIndex === -1 && schedule.length > 0) {
                if (now < schedule[0].start) {
                    activeRoundIndex = 0;
                    phase = "UPCOMING";
                } else {
                    activeRoundIndex = schedule.length - 1;
                    phase = "RANKING";
                }
            }

            // Determine what exactly to display on screen
            let displayRound = schedule[activeRoundIndex].round;
            let iframeId = links[currentCategory][activeRoundIndex];
            let showPlayersHash = false;
            
            // If we are waiting for a round to start (and it's not Round 1), 
            // show the PREVIOUS round's ranking table
            if (phase === "UPCOMING" && activeRoundIndex > 0) {
                displayRound = schedule[activeRoundIndex - 1].round;
                iframeId = links[currentCategory][activeRoundIndex - 1];
                showPlayersHash = true;
            }

            if (phase === "RANKING") {
                showPlayersHash = true;
            }

            // Construct Iframe URL with dynamic theme background
            const bgTheme = isDarkMode ? "dark" : "light";
            const baseUrl = `https://lichess.org/embed/broadcast/sri-lanka-national-chess-championship-2026--${currentCategory}/round-${displayRound}/${iframeId}`;
            const params = `?theme=blue3&pieceSet=merida&bg=${bgTheme}`;
            let finalUrl = baseUrl + params;
            if (showPlayersHash) {
                finalUrl += "#players";
            }

            // Update Iframe
            const iframe = document.getElementById("broadcast-iframe");
            if (lastRenderedUrl !== finalUrl) {
                iframe.src = finalUrl;
                lastRenderedUrl = finalUrl;
            }

            // UI Elements
            const titleEl = document.getElementById("live-status-text");
            const timerContainer = document.getElementById("countdown-timer");

            // Update Titles and Countdown
            if (countdownTo) {
                timerContainer.style.display = "flex";
                
                const diff = countdownTo - now;
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);
                
                document.getElementById("cd-hours").innerText = String(h).padStart(2, '0');
                document.getElementById("cd-mins").innerText = String(m).padStart(2, '0');
                document.getElementById("cd-secs").innerText = String(s).padStart(2, '0');
                
                let nextRnd = (phase === "UPCOMING") ? schedule[activeRoundIndex].round : schedule[activeRoundIndex + 1].round;
                titleEl.innerHTML = `Round ${nextRnd} Begins In:`;
            } else {
                timerContainer.style.display = "none";
                
                if (phase === "LIVE") {
                    titleEl.innerHTML = `Round ${displayRound} Broadcast ` + getLiveBadge();
                } else if (showPlayersHash) {
                    // Changed from "Round X Results" to "Ranking After Round X"
                    titleEl.innerHTML = `Ranking After Round ${displayRound}`;
                } else {
                    titleEl.innerHTML = `Round ${displayRound} Upcoming`;
                }
            }
        }

        window.onload = () => {
            document.getElementById("year").innerText = new Date().getFullYear();
            updateLogic();
            // Refresh logic every second to keep the timer and phase transitions accurate
            setInterval(updateLogic, 1000);
        }
    </script>
</body>
</html>
